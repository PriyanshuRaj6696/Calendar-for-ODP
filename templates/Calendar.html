{% extends 'base.html' %}

<!-- Body content -->
{% block body %}
    <div class="mainbody" data-username="{{ username }}">
        <div class="calendar-container">
        <header class="calendar-header">
            <p class="calendar-current-date"></p>
            <div class="calendar-navigation">
                <div id="calendar-prev" class="material-symbols-rounded">
                    <img src="{{ url_for('static', filename='images/left-arrow.png') }}" 
                        width="30px" height="30px" alt="Previous">
                </div>
                <div id="calendar-next" class="material-symbols-rounded">
                    <img src="{{ url_for('static', filename='images/right-arrow.png') }}" 
                        width="30px" height="30px" alt="Next">
                </div>
            </div>
        </header>

        <div class="calendar-body">
            <ul class="calendar-weekdays">
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
            </ul>
            <ul class="calendar-dates"></ul>
        </div>
        </div>
    </div>
    <div class="date-division">
        <div class="date-preview"></div>
        <div class="date-events"></div>
    </div>
{% endblock %}

<!-- Script for the page -->
{% block script %}
    <script>
        window.calendarUsername = "{{ username }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
